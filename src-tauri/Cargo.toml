[package]
name = "aura-decomp-tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
# SHA-1 is required by the SCE SDK symbol matcher (ps2recomp computes a
# SHA-1 over each candidate function body after masking out relocated words).
sha1 = "0.10"
# iced-x86 decodes/formats 32-bit x86 for the original Xbox (XBE) backend.
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "intel", "std"] }
# mlua provides the Lua 5.4 scripting API (Tier 3). Vendored = no system Lua.
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[dev-dependencies]
tauri-build = { version = "2.0" }
toml = "0.8"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
