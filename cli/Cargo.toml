[package]
name = "aura-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
rust-version = "1.70"
description = "Command-line interface and shared analysis library for Aura Decomp Tool"

# The CLI links the shared analysis engine (src-tauri/src) directly via #[path]
# includes in src/lib.rs, so it builds without Tauri and produces a tiny
# standalone binary. The same library is also the public API consumed by the
# test suite, so the module wiring lives in exactly one place.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
# Pure-Rust CHD reader: the usual format of retro disc collections.
chd = "0.3"
# SHA-256 verifies the downloaded build toolchain against its published digest.
sha2 = "0.10"
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "intel", "std"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[lib]
name = "aura_cli"
path = "src/lib.rs"

[[bin]]
name = "aura-cli"
path = "src/main.rs"

# Tiny double-click launcher copied into packaged game folders. It includes
# only `launcher_core.rs` (not the analysis library), so it stays small.
[[bin]]
name = "aura-launch"
path = "src/launch.rs"

# CHD images are decompressed on demand while browsing a disc; unoptimised
# LZMA/zlib/FLAC makes that crawl in `cargo tauri dev`. Optimise just these.
[profile.dev.package.chd]
opt-level = 3
[profile.dev.package.lzma-rs-perf-exp]
opt-level = 3
[profile.dev.package.claxon]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.ruzstd]
opt-level = 3
